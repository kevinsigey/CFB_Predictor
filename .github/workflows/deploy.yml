name: Deploy CFB Predictor

on:
# A merge to main deploys. The paths filter is the whole reason this is safe to
# run automatically: it lists what goes INTO the image, and the output of the
# scheduled refresh jobs is deliberately absent, so a data refresh (on a timer,
# several times a day) does not redeploy the service. Those files are polled
# from raw.githubusercontent.com at runtime, so a new snapshot never needs a new
# image.
#
# The filter is a whitelist, so an exclusion cannot be expressed in it: add
# `data/**` and every refresh becomes a deploy. tests/test_deploy_workflow.py
# asserts both halves — that the app's own files are watched, and that the
# refresh jobs' output is not.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'models/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  # To push the image to GHCR as the repo's own actor, using GITHUB_TOKEN. A
  # personal access token would be a credential that outlives the repo and has
  # to be rotated by hand.
  packages: write
  # Only the Azure job uses this, and only when DEPLOY_AZURE is set.
  id-token: write

jobs:
  build:
    name: Build and push the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          # GHCR_PAT, not GITHUB_TOKEN. The package ghcr.io/kevinsigey/cfb-predictor is
          # USER-scoped, not linked to this repository, and GITHUB_TOKEN may only write to
          # packages linked to its own repo -- so the push died with
          # `denied: permission_denied: write_package` after the image had already built
          # and tagged correctly. Linking the package is a one-time action in package
          # settings with no API, and until someone does it by hand, GITHUB_TOKEN cannot
          # push here at all. The PAT is already a secret on this repo -- it is the
          # credential these images have always been pushed with -- so this is not a new
          # long-lived credential, it is the one already in use.
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Registry layer cache (:buildcache in GHCR, only ever pulled by CI). The Dockerfile installs dependencies from
      # pyproject.toml alone, so an unchanged dependency set is a cache HIT and keeps the same layer digest across
      # commits; the VPS pulls only the thin app layers per deploy. provenance is off so the pushed image stays a
      # plain single-manifest image for `compose pull`.
      - name: Build and push CFB Predictor image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/kevinsigey/cfb-predictor:${{ github.sha }}
            ghcr.io/kevinsigey/cfb-predictor:latest
          cache-from: type=registry,ref=ghcr.io/kevinsigey/cfb-predictor:buildcache
          cache-to: type=registry,ref=ghcr.io/kevinsigey/cfb-predictor:buildcache,mode=max


  # Legacy. Azure is being cut over to the VPS, so this stays off unless the
  # repo sets DEPLOY_AZURE=true. Gated on `== 'true'` and not `!= 'false'`:
  # the failing-open form turns Azure back on for every repo that has not
  # explicitly set the variable, which is the opposite of the intent.
  deploy-azure:
    name: Deploy to Azure (legacy)
    needs: build
    if: vars.DEPLOY_AZURE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Azure
        run: |
          az login --service-principal -u "${{ secrets.AZURE_CLIENT_ID }}" -p "${{ secrets.AZURE_CLIENT_SECRET }}" --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Create / Update CFB Predictor Container App
        run: |
          az containerapp create \
            --name cfb-predictor \
            --resource-group predictor-hub-rg \
            --environment proudbay-f56b8dfa.eastus2 \
            --image ghcr.io/kevinsigey/cfb-predictor:${{ github.sha }} \
            --target-port 8003 \
            --ingress external \
            --min-replicas 0 \
            --max-replicas 3 \
            --cpu 0.5 \
            --memory 1Gi \
            --env-vars PYTHONPATH=/app/src PUBLIC_MODE=true ODDS_API_KEY=secretref:odds-api-key SPORTSBOOK_API_KEY=secretref:sportsbook-api-key \
            --secrets odds-api-key=${{ secrets.ODDS_API_KEY }} sportsbook-api-key=${{ secrets.SPORTSBOOK_API_KEY }} \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true

          az containerapp update \
            --name cfb-predictor \
            --resource-group predictor-hub-rg \
            --image ghcr.io/kevinsigey/cfb-predictor:${{ github.sha }} \
            --min-replicas 0 \
            --max-replicas 3 || true

          az containerapp secret set \
            --name cfb-predictor \
            --resource-group predictor-hub-rg \
            --secrets odds-api-key=${{ secrets.ODDS_API_KEY }} sportsbook-api-key=${{ secrets.SPORTSBOOK_API_KEY }}

          az containerapp update \
            --name cfb-predictor \
            --resource-group predictor-hub-rg \
            --set-env-vars ODDS_API_KEY=secretref:odds-api-key SPORTSBOOK_API_KEY=secretref:sportsbook-api-key
          az containerapp ingress enable --name cfb-predictor --resource-group predictor-hub-rg --type external --target-port 8003 || true

  # Pulls the image pushed above on the VPS stack at /opt/stack. `bin/deploy` is
  # the only thing the CI key can ask for -- a forced command in the deploy
  # user's authorized_keys -- and it pins the sha in .env, restarts,
  # health-checks, and rolls back to the previous tag if the new one is unhealthy.
  vps:
    name: Deploy to the VPS
    needs: build
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    # One deploy at a time per service: two repos pushing at once race on
    # /opt/stack/.env. bin/deploy takes its own lock too; this keeps the queue
    # off the box.
    concurrency: vps-deploy-cfb
    steps:
      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # Written before the first connection, or ssh prompts to confirm the
          # host key and the job hangs until it times out.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh deploy@${{ vars.VPS_HOST }} deploy cfb ${{ github.sha }}
